version: 2

models:
  - name: clean_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
  - name: clean_accounts
    columns:
      - name: account_id
        tests:
          - not_null
          - unique
  - name: clean_transactions
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('standardized', 'accounts')
                field: account_id